<title>Risser Rewards</title>
<style>
:root{--g:#1f6848;--bg:#f5f5ef;--ink:#182019;--muted:#68736b;--line:#e0e6de;--gold:#d6a62f;--red:#b64e45;--amber:#986a14;--shadow:0 10px 28px rgba(28,64,41,.10)}
*{box-sizing:border-box}html,body{margin:0;background:var(--bg);color:var(--ink);font-family:ui-rounded,system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}
button,input,select{font:inherit}button{cursor:pointer;min-height:46px}.app{max-width:1160px;margin:auto;padding:16px 14px 58px}
.top{display:flex;justify-content:space-between;align-items:center;gap:12px;flex-wrap:wrap}.brand{font-size:clamp(29px,5vw,48px);font-weight:950;letter-spacing:-.05em}.sub,.muted{color:var(--muted)}
.btn{border:0;border-radius:15px;padding:10px 14px;font-weight:900;background:var(--g);color:#fff}.btn.secondary{background:#fff;color:var(--ink);border:1px solid var(--line)}.btn.red{background:var(--red)}.btn.gold{background:var(--gold)}.btn.small{min-height:38px;padding:7px 10px;font-size:13px}
.verseBanner{background:linear-gradient(135deg,#fff8df,#f7edc7);border:1px solid #e5cf87;border-radius:20px;padding:14px 16px;margin:14px 0;box-shadow:0 8px 22px rgba(89,68,20,.08)}.verseRef{font-weight:950;margin-top:6px;color:#6c5420}.scoreGrid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px}.goalCard{border:1px solid #ddd;border-radius:16px;padding:12px;margin-top:10px}.goalBar{height:12px;background:#eee;border-radius:99px;overflow:hidden;margin-top:8px}.goalFill{height:100%;background:currentColor}.summerOn{background:#fff0b8!important;border-color:#d6a800!important}@media(max-width:700px){.scoreGrid{grid-template-columns:1fr}}.tabs{display:flex;gap:8px;flex-wrap:wrap;margin:16px 0}.tab{border:1px solid var(--line);background:#fff;border-radius:999px;padding:9px 13px}.tab.on{background:var(--g);color:#fff;border-color:var(--g)}
.card{background:#fff;border:1px solid var(--line);border-radius:22px;padding:16px;box-shadow:var(--shadow);margin-bottom:13px}.flat{box-shadow:none}
.grid{display:grid;grid-template-columns:repeat(12,minmax(0,1fr));gap:12px}.half{grid-column:span 6}.third{grid-column:span 4}.quarter{grid-column:span 3}.full{grid-column:1/-1}
.row{display:flex;align-items:center;justify-content:space-between;gap:10px}.wrap{flex-wrap:wrap}.actions{display:flex;gap:8px;flex-wrap:wrap;align-items:center}.metric{font-size:29px;font-weight:950;letter-spacing:-.035em}.tiny{font-size:12px}
.progress{height:13px;background:#edf0e9;border-radius:999px;overflow:hidden}.bar{height:100%;background:linear-gradient(90deg,#3d8058,#9fce84,#d4ad3d)}
.badge{display:inline-flex;align-items:center;gap:5px;background:#f0f3ef;border-radius:999px;padding:6px 9px;font-size:12px;font-weight:900}
.notice{padding:12px 13px;border-radius:14px;background:#e6f1e6}.warn{background:#fff0c9}.attention{background:linear-gradient(135deg,#fff0c8,#fff9e9);border:2px solid #dfbb58}
.task,.approval,.ledgerRow{display:flex;justify-content:space-between;align-items:center;gap:12px;padding:13px 0;border-top:1px solid var(--line)}.task:first-child,.approval:first-child,.ledgerRow:first-child{border-top:0}
.reward{font-size:12px;color:var(--muted);margin-top:4px}.status{font-size:11px;font-weight:950;text-transform:uppercase;margin-top:5px}.pending{color:var(--amber)}.approved{color:var(--g)}.missed{color:var(--red)}
label{font-size:13px;font-weight:850}input,select{width:100%;min-height:45px;border:1px solid #cbd4ca;border-radius:12px;padding:9px 10px;background:#fff;color:var(--ink);font-size:16px}input[type=checkbox]{width:auto;min-height:auto}
.chores{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:11px}.chore{border:2px solid #edf0e8;background:#fff;border-radius:20px;padding:12px 8px;text-align:center}.chore:disabled{opacity:.48}.icon{font-size:50px}.name{font-weight:900;font-size:14px;margin-top:5px}
.pill{display:inline-flex;padding:5px 8px;border-radius:999px;font-size:11px;font-weight:900}.req{background:#f7ded9;color:#843328}.due{background:#fff0ca;color:#7e5a10}.opt{background:#e7f2e8;color:#27613c}
.login{text-align:center;max-width:520px;margin:50px auto}.google{background:#fff;color:#222;border:1px solid #d8ddd8}
.confirmBox{position:fixed;inset:0;background:rgba(12,20,16,.55);display:grid;place-items:center;padding:18px;z-index:999}.confirmCard{max-width:420px;width:100%;background:#fff;border-radius:22px;padding:18px;box-shadow:0 20px 50px rgba(0,0,0,.25)}.undoToast{margin:14px auto 0;max-width:520px;background:#173c2b;color:#fff;padding:12px 14px;border-radius:16px;font-weight:900;display:flex;justify-content:space-between;align-items:center;gap:12px}.kidChooser{margin:10px 0 18px}.kidChooserTitle{font-size:22px;font-weight:950;margin-bottom:10px}.kidChoices{display:grid;grid-template-columns:repeat(4,1fr);gap:10px}.kidChoice{border:2px solid rgba(0,0,0,.10);background:#fff;border-radius:20px;padding:12px 8px;min-height:104px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:5px;font-weight:950;font-size:15px;cursor:pointer;box-shadow:0 5px 14px rgba(0,0,0,.06)}.kidChoice .kidEmoji{font-size:42px;line-height:1}.kidChoice.on{border-color:#173c2b;box-shadow:0 0 0 3px rgba(23,60,43,.12)}@media(max-width:650px){.kidChoices{grid-template-columns:repeat(2,1fr)}.kidChoice{min-height:96px}}.counter{display:flex;justify-content:center;align-items:center;gap:15px;margin:16px}.counter button{width:58px;height:58px;border-radius:50%;border:0;background:var(--g);color:#fff;font-size:28px}.count{font-size:48px;font-weight:950}

/* Individual kid worlds */
.world{position:relative;overflow:hidden;border-radius:28px;padding:22px;margin-bottom:14px;min-height:235px;box-shadow:0 14px 34px rgba(25,55,35,.13)}
.world .wicon{font-size:78px;line-height:1}.world h2{font-size:34px;margin:5px 0}.world .wsub{font-weight:900}.worldBadges{display:flex;gap:7px;flex-wrap:wrap;margin-top:13px;position:relative;z-index:2}.worldBadge{background:rgba(255,255,255,.82);color:#203024;border-radius:999px;padding:7px 10px;font-size:12px;font-weight:900}
.noahWorld{color:#eef8ff;background:radial-gradient(circle at 83% 18%,#f6fbff 0 4%,transparent 4.5%),linear-gradient(180deg,#193954 0 42%,#28523a 42% 63%,#103022 63%)}.noahWorld:after{content:"🌲  🌲  🐺  🌲  🌲";position:absolute;right:18px;bottom:18px;font-size:36px;opacity:.82}
.eliWorld{color:#462d0a;background:radial-gradient(circle at 84% 18%,#fff5ad 0 8%,transparent 8.5%),linear-gradient(180deg,#ffcf67 0 55%,#d98c3b 55% 62%,#cda246 62%)}.eliWorld:after{content:"🌾  🦁  🌳  🌾";position:absolute;right:18px;bottom:18px;font-size:38px;opacity:.8}
.shepherdWorld{color:#efffeb;background:radial-gradient(circle at 20% 18%,rgba(190,255,167,.25) 0 5%,transparent 6%),linear-gradient(145deg,#123d29,#1f6a3f 52%,#0e3929)}.shepherdWorld:after{content:"🌿  🐍  🌴  🐺";position:absolute;right:18px;bottom:18px;font-size:38px;opacity:.82}
.juniperWorld{color:#65306c;background:linear-gradient(135deg,#ffd5ef 0 18%,#f2d7ff 18% 36%,#d6edff 36% 54%,#def7dd 54% 72%,#fff0a5 72%)}.juniperWorld:before{content:"";position:absolute;left:-10%;right:-10%;bottom:-39%;height:73%;border-radius:50%;border-top:18px solid rgba(255,113,178,.46);box-shadow:0 -18px 0 rgba(255,194,84,.46),0 -36px 0 rgba(98,196,255,.42),0 -54px 0 rgba(155,110,255,.38)}.juniperWorld:after{content:"☁️  🌈  🦄  ⭐";position:absolute;right:18px;bottom:18px;font-size:39px;opacity:.9}.world>*{position:relative;z-index:1}

.masterCard{box-shadow:none;margin:0}.assignments{display:flex;gap:7px;flex-wrap:wrap;margin-top:10px}.assignments label{display:inline-flex;align-items:center;gap:5px;background:#f3f5f1;border-radius:999px;padding:6px 9px}
.settingsGrid{display:grid;grid-template-columns:1fr 1fr 1fr 1fr;gap:8px;margin-top:10px}
.cashCards{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:12px}.cashCard{border:1px solid var(--line);border-radius:18px;padding:14px;background:#fff}.owed{font-size:27px;font-weight:950}
.good{color:#267148}.mid{color:#9b6a13}.low{color:#a44339}
.challengeGrid{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:10px}
.challenge{border:2px solid #e6eadf;border-radius:19px;padding:13px;background:linear-gradient(145deg,#fff,#f6f8f1)}
.challenge .big{font-size:42px}.challenge h3{margin:5px 0 3px}.streak{font-weight:950;color:#b75b22}
.weekTrack{display:flex;gap:4px;margin-top:9px}.dayDot{width:23px;height:23px;border-radius:50%;display:grid;place-items:center;background:#ecefe8;font-size:10px;font-weight:900}.dayDot.hit{background:#cce8cf}.dayDot.miss{background:#f1d2cd}
.parentAward{background:linear-gradient(135deg,#f3e9ff,#fff7d9)}
@media(max-width:900px){.challengeGrid{grid-template-columns:repeat(2,1fr)}}
@media(max-width:900px){.chores{grid-template-columns:repeat(3,1fr)}.settingsGrid{grid-template-columns:1fr 1fr}.cashCards{grid-template-columns:1fr 1fr}}
@media(max-width:700px){.half,.third,.quarter{grid-column:1/-1}.chores{grid-template-columns:repeat(2,1fr)}.task,.approval,.ledgerRow{align-items:flex-start;flex-direction:column}.world h2{font-size:29px}}
@media(max-width:430px){.app{padding:12px 10px 45px}.cashCards{grid-template-columns:1fr}.settingsGrid{grid-template-columns:1fr}.world{padding:18px;min-height:220px}.world .wicon{font-size:66px}.world:after{font-size:29px}}

.fiveTabs{display:grid!important;grid-template-columns:repeat(5,minmax(0,1fr));gap:6px}
.fiveTabs .tab{white-space:normal;line-height:1.15;min-height:52px;padding:8px 5px}
@media(max-width:700px){
  .fiveTabs{grid-template-columns:repeat(5,minmax(64px,1fr));overflow-x:auto}
  .fiveTabs .tab{font-size:12px}
}

/* ===== v46.5 Adventure Visual Refresh — visual only ===== */
:root{
 --g:#173f2d;--g2:#285d42;--pine:#102f24;--cream:#f8f3e8;--paper:#fffdf7;
 --sand:#eadcc0;--gold:#d5a526;--gold2:#efc44f;--clay:#a9582d;--sky:#b9d1cf;
 --ink:#1b261e;--muted:#677168;--line:#ded6c4;--red:#a95042;--amber:#9d711d;
 --shadow:0 10px 30px rgba(31,49,35,.09);--shadow-lg:0 18px 46px rgba(21,47,33,.16)
}
html,body{
 background:
   radial-gradient(circle at 20% -8%,rgba(185,209,207,.42),transparent 34%),
   linear-gradient(180deg,#f5efe2 0,#fbf8ef 260px,#f4f1e8 100%);
 color:var(--ink)
}
body:before{content:"";position:fixed;inset:0;pointer-events:none;z-index:-1;opacity:.2;
 background-image:linear-gradient(rgba(61,78,65,.03) 1px,transparent 1px),linear-gradient(90deg,rgba(61,78,65,.03) 1px,transparent 1px);
 background-size:28px 28px}
.app{max-width:1220px;padding:18px 16px 72px}

/* Masthead */
.top{background:rgba(255,253,247,.76);backdrop-filter:blur(10px);border:1px solid rgba(216,207,187,.78);
 border-radius:22px;padding:12px 14px;box-shadow:0 8px 24px rgba(35,54,40,.07)}
.brandWrap{display:flex;align-items:center;gap:11px}
.brandPeak{width:42px;height:42px;border-radius:50%;display:grid;place-items:center;color:#efc95b;
 background:linear-gradient(145deg,#173f2d,#0d2a1f);box-shadow:inset 0 0 0 2px rgba(255,255,255,.08),0 5px 14px rgba(18,49,35,.18)}
.brand{font-family:Georgia,"Times New Roman",serif;font-size:clamp(23px,4vw,37px);font-weight:800;letter-spacing:.015em;line-height:.9;color:var(--pine)}
.sub{font-size:12px;letter-spacing:.025em;margin-top:5px}

/* Main navigation */
.fiveTabs{position:sticky;top:8px;z-index:40;margin:14px 0 18px!important;padding:7px;
 background:linear-gradient(135deg,#0f3024,#173f2d 52%,#244d38);border:1px solid rgba(255,255,255,.08);
 border-radius:20px;box-shadow:0 10px 26px rgba(16,46,33,.20)}
.fiveTabs .tab{min-height:54px;background:transparent;color:#f8f1df;border:1px solid transparent;border-radius:14px;
 font-weight:800;letter-spacing:.01em;transition:.18s ease}
.fiveTabs .tab:hover{background:rgba(255,255,255,.07)}
.fiveTabs .tab.on{background:linear-gradient(180deg,rgba(255,255,255,.17),rgba(255,255,255,.09));color:#fff9e8;
 border-color:rgba(239,198,77,.72);box-shadow:inset 0 0 0 1px rgba(255,255,255,.05),0 3px 12px rgba(0,0,0,.14)}

/* Type + surfaces */
h1,h2,h3{color:#172d21}
h2{font-family:Georgia,"Times New Roman",serif;letter-spacing:-.02em;font-weight:700}
.metric{font-family:Georgia,"Times New Roman",serif;color:var(--pine)}
.card{background:linear-gradient(180deg,rgba(255,253,247,.99),rgba(249,246,237,.99));border:1px solid rgba(215,206,185,.9);
 border-radius:20px;box-shadow:var(--shadow)}
.notice{background:linear-gradient(145deg,#edf3e8,#e5eee0);border:1px solid #d0ddc8}
.warn{background:linear-gradient(145deg,#fff4d5,#f8e9b9);border-color:#ead193}
.attention{background:linear-gradient(135deg,#fff0c8,#fffaf0);border:1px solid #e6c56d;box-shadow:0 10px 28px rgba(117,82,16,.09)}
.goalCard{background:rgba(255,255,255,.55);border-color:#ded6c2}
.progress,.goalBar{background:#e9e4d7}
.bar,.goalFill{background:linear-gradient(90deg,#24573d,#6e9861,#d9ad34)}
.badge{background:#f0ece1;border:1px solid #e0d9c9;color:#344237}

/* Controls */
.btn{border-radius:12px;background:linear-gradient(180deg,#22563d,#173f2d);box-shadow:0 3px 8px rgba(22,62,44,.16)}
.btn:hover{filter:brightness(1.04)}
.btn.secondary{background:#fffdf8;border-color:#d8d0be;box-shadow:none}
.btn.gold{background:linear-gradient(180deg,#dfb344,#c9951e);color:#2d2614}
input,select{background:#fffefa;border-color:#cfc7b5}
input:focus,select:focus{outline:2px solid rgba(52,99,70,.18);border-color:#6d9276}

/* Scripture / journal note */
.verseBanner{background:linear-gradient(90deg,rgba(205,169,85,.08) 1px,transparent 1px),linear-gradient(#fff9e8,#f8efd6);
 background-size:24px 100%,auto;border:1px solid #dfc47d;border-left:5px solid #bb8c2c;border-radius:16px;
 box-shadow:0 6px 18px rgba(89,68,20,.07)}

/* Kids landing — scenic adventure cover */
.adventureLanding{overflow:hidden;border-radius:28px;border:1px solid #cfc2a7;background:#fff9ed;box-shadow:var(--shadow-lg);margin-bottom:16px}
.adventureSky{position:relative;min-height:305px;padding:38px 24px 120px;text-align:center;overflow:hidden;
 background:radial-gradient(circle at 50% 7%,rgba(255,241,183,.98) 0 8%,rgba(255,241,183,.32) 9%,transparent 25%),
 linear-gradient(180deg,#d8e3de 0,#f5e5bd 62%,#d0b67f 100%)}
.adventureSky:before{content:"";position:absolute;left:-4%;right:-4%;bottom:28px;height:185px;
 background:linear-gradient(135deg,transparent 0 12%,#87957a 12% 19%,transparent 19% 25%,#6d8068 25% 35%,transparent 35% 42%,#80927b 42% 53%,transparent 53% 61%,#647761 61% 72%,transparent 72%);
 opacity:.9}
.adventureSky:after{content:"";position:absolute;left:0;right:0;bottom:-2px;height:105px;background:linear-gradient(180deg,#315d43,#173f2d);
 clip-path:polygon(0 58%,7% 31%,12% 55%,18% 18%,23% 59%,30% 36%,36% 70%,42% 24%,48% 58%,55% 16%,61% 58%,68% 29%,75% 65%,82% 23%,88% 55%,94% 32%,100% 58%,100% 100%,0 100%)}
.adventureMark{position:relative;z-index:3;display:inline-grid;place-items:center;width:46px;height:46px;border:2px solid #244c37;border-radius:50%;color:#244c37;font-size:27px;font-weight:900;margin-bottom:8px}
.adventureTitle{position:relative;z-index:3;font-family:Georgia,"Times New Roman",serif;font-weight:800;letter-spacing:.015em;line-height:.84;
 color:#123c29;font-size:clamp(38px,7vw,67px);text-shadow:0 1px rgba(255,255,255,.55)}
.adventureTagline{position:relative;z-index:3;margin-top:16px;color:#273b2d;font-weight:800;font-size:15px}
.adventurePicker{position:relative;z-index:5;margin-top:-72px;padding:0 18px 20px}
.adventurePicker .kidChooser{margin:0}
.adventurePicker .kidChooserTitle{text-align:center;color:#fff9e8;text-shadow:0 2px 6px rgba(0,0,0,.25);
 font-family:Georgia,"Times New Roman",serif;font-size:20px}
.adventurePicker .kidChoices{gap:10px}
.kidChoice{overflow:hidden;min-height:170px;justify-content:flex-end;padding:16px 8px 13px;border-radius:18px;color:#fff;
 border:1px solid rgba(255,255,255,.55);box-shadow:0 8px 18px rgba(15,42,29,.18),inset 0 0 0 1px rgba(255,255,255,.10);position:relative}
.kidChoice:before{content:"";position:absolute;inset:0;background:linear-gradient(180deg,rgba(255,255,255,.08),transparent 38%,rgba(0,0,0,.34));pointer-events:none}
.kidChoice>*{position:relative;z-index:2}
.kidChoice .kidEmoji{font-size:58px;filter:drop-shadow(0 4px 5px rgba(0,0,0,.18));margin-bottom:auto}
.kidChoice .kidName{font-family:Georgia,"Times New Roman",serif;font-size:22px}
.kidWorldLabel{font-size:10px;opacity:.92;font-weight:750}
.kidSelected{margin-top:5px;background:rgba(255,255,255,.9);color:#173f2d;padding:3px 7px;border-radius:999px}
.kidChoice.kid-noah{background:linear-gradient(150deg,#527779,#244d47 56%,#102f24)}
.kidChoice.kid-eli{background:linear-gradient(150deg,#d0a044,#9d6128 55%,#65401e)}
.kidChoice.kid-shepherd{background:linear-gradient(150deg,#6d904f,#315b35 58%,#183e2a)}
.kidChoice.kid-juniper{background:linear-gradient(150deg,#c091ba,#8d74a0 52%,#617f8c)}
.kidChoice.on{border-color:#f4cf5b;box-shadow:0 0 0 3px rgba(240,195,66,.35),0 10px 22px rgba(15,42,29,.2)}
.familyAdventure{margin-top:12px;padding:13px 15px;border-radius:15px;background:linear-gradient(145deg,#f1e6cb,#e6d7b8);
 border:1px solid #cfbd96;display:flex;gap:11px;align-items:center;color:#273329}
.compassMedallion{width:42px;height:42px;display:grid;place-items:center;border-radius:50%;color:#e7bb3d;background:#173f2d;font-size:20px}

/* Individual worlds */
.world{border:1px solid rgba(255,255,255,.22);box-shadow:0 16px 38px rgba(22,49,35,.18);min-height:250px}
.world:before{content:"";position:absolute;inset:auto 0 0 0;height:42%;background:linear-gradient(180deg,transparent,rgba(11,34,24,.25));pointer-events:none}
.worldBadge{background:rgba(255,253,244,.9);border:1px solid rgba(255,255,255,.65);box-shadow:0 3px 8px rgba(0,0,0,.07)}
.world h2{font-family:Georgia,"Times New Roman",serif;letter-spacing:-.02em}

/* Missions / chores / growth */
.chore{border:1px solid #ded6c3;background:linear-gradient(180deg,#fffef9,#f8f3e8);box-shadow:0 5px 14px rgba(37,56,41,.06);
 transition:transform .15s ease,box-shadow .15s ease}
.chore:hover{transform:translateY(-2px);box-shadow:0 9px 20px rgba(37,56,41,.10)}
.icon{filter:drop-shadow(0 3px 4px rgba(0,0,0,.08))}
.challenge{border:1px solid #d8d2c2;background:radial-gradient(circle at 90% 10%,rgba(116,143,94,.08),transparent 23%),linear-gradient(145deg,#fffdf7,#f3efe4);box-shadow:0 5px 14px rgba(37,56,41,.05)}
.challenge .big{width:58px;height:58px;display:grid;place-items:center;background:#e6eadc;border:1px solid #ccd5bf;border-radius:50%}
.streak{color:#9f5d25}

/* Internal kid subnav */
.card:has([data-v="week"].btn){background:linear-gradient(135deg,#193f2e,#244d39);border-color:#173b2b;padding:8px}
.card:has([data-v="week"].btn) .btn{background:transparent;border:1px solid transparent;color:#f8f0de;box-shadow:none}
.card:has([data-v="week"].btn) .btn:not(.secondary){background:rgba(255,255,255,.12);border-color:#dfbd55;color:white}
.card:has([data-v="week"].btn) .btn.secondary{color:#f8f0de}

/* Parent HQ, earnings, rewards, settings refinement */
.approval{border-top-color:#e3dccb}
.cashCard{background:linear-gradient(180deg,#fffdf8,#f5f0e5);border-color:#dcd3bf;box-shadow:0 7px 18px rgba(37,56,41,.06)}
.owed{font-family:Georgia,"Times New Roman",serif;color:#173f2d}
.ledgerRow{border-top-color:#e4ddce}
.masterCard{background:#fffdf8;border-color:#ded6c3}
.assignments label{background:#eee9dd;border:1px solid #dfd6c3}
.confirmCard{background:#fffaf0;border:1px solid #d9cdb5}

@media(max-width:700px){
 .top{border-radius:18px}.fiveTabs{top:5px;border-radius:16px;padding:5px}.fiveTabs .tab{font-size:11px;min-height:49px}
 .adventureSky{min-height:245px;padding-top:28px}.adventurePicker{margin-top:-62px;padding:0 10px 14px}
 .adventurePicker .kidChoices{grid-template-columns:repeat(2,1fr)}.kidChoice{min-height:145px}.kidChoice .kidEmoji{font-size:48px}

// Enforce the family rules requested for the known built-in chores.
// Parents can still customize all other chores normally.
function applyBuiltInPolicy(c){
  const x={...c};

  // Daily/basic responsibilities = points only.
  if(["pets","goats","eggs","litter","ktable","load","unload","dishes","trash","towels","sports"].includes(x.id)){
    x.paid=false; x.cash=0; x.car=0;
  }
  if(["pets","goats","eggs"].includes(x.id)){
    x.required=true; x.frequency="daily";
  }

  // Shared chores that naturally rebuild throughout the day.
  if(["load","unload","dishes"].includes(x.id)){
    x.exclusive=true;
    x.required=false;
    x.paid=false;
    x.cash=0; x.car=0;
    x.frequency="everyhours";
    x.intervalHours=4;
    x.points=2;
  }

  if(x.id==="living"){
    x.exclusive=true;
    x.required=false;
    x.paid=false;
    x.cash=0; x.car=0;
    x.frequency="everyhours";
    x.intervalHours=1;
    x.points=2;
    x.maxRewardedClaimsPerDay=3;
  }

  const paidMap={
    counters:[1.2,.8], cardboard:[1.2,.8], fold:[1.2,.8], putclothes:[1.2,.8],
    laundry:[1.8,1.2], dogwater:[1.2,.8], catwater:[1.2,.8],

    carclean:[2.4,1.6], carwash:[3,2], kart:[1.8,1.2], weeds:[1.8,1.2], garage:[3.6,2.4]
  };
  if(paidMap[x.id]){
    x.paid=true;
    x.required=false;
    x.cash=paidMap[x.id][0];
    x.car=paidMap[x.id][1];
    if(!["carwash","kart","weeds"].includes(x.id)) x.frequency="weekly";
  }

  return x;
}
function rawLibrary(){
  const saved=Array.isArray(data?.choreLibrary)&&data.choreLibrary.length?data.choreLibrary:[];

  const map=new Map(saved.map(c=>[c.id,c]));
  const merged=DEFAULTS.map(d=>applyBuiltInPolicy(normalize({...d,...(map.get(d.id)||{})})));
  saved.filter(c=>!DEFAULTS.some(d=>d.id===c.id))
       .forEach(c=>merged.push(normalize(c)));
  return merged;
}

  });
}

async function applyYesterdayMisses(){
  if(!data||vacationMode())return;
  let date=prevDateKey();
  if(vacationDay(date))return;
  await runTransaction(db,async tr=>{
    let s=await tr.get(familyRef),d=s.data();
    if(d.vacationMode||vacationDay(date,d))return;
    let kids=(d.kids||[]).map(k=>({...k})),ledger=[...(d.ledger||[])],changed=false;
    let saved=Array.isArray(d.choreLibrary)&&d.choreLibrary.length?d.choreLibrary:DEFAULTS;
    let lib=saved.map(normalize).filter(c=>c.active!==false&&c.required&&requiredDueOnDate(c,date));
    if(d.summerMode)lib=lib.filter(c=>!isSchoolChore(c));
    for(let c of lib){
      // A newly created/activated/required chore never receives a penalty for that same calendar day.
      let startsAt=+c.requiredSince||+c.activatedAt||+c.createdAt||0;
      if(startsAt&&dateKeyFromMs(startsAt)>=date)continue;

      // SHARED / FIRST-KID-ONLY RULE:
      // One assigned kid completing the chore satisfies it for every assigned kid.
      // Submitted work protects everyone even if the parent approves it the following day.
      if(c.exclusive){
        let sharedDone=(d.tasks||[]).some(t=>{
          if(t.choreId!==c.id||!(c.assignedTo||[]).includes(t.kidId))return false;
          let completedMs=+t.submittedAt||+t.approvedAt||0;
          return completedMs&&dateKeyFromMs(completedMs)===date&&(t.status==="pending"||t.status==="approved");
        });
        if(sharedDone)continue;
      }

      for(let k of kids.filter(k=>(c.assignedTo||[]).includes(k.id))){
        let key=`miss:${date}:${k.id}:${c.id}`;
        if(ledger.some(x=>x.type==="required_miss"&&x.key===key))continue;
        // For non-shared chores, each assigned kid must complete their own chore.
        let done=(d.tasks||[]).some(t=>{
          if(t.kidId!==k.id||t.choreId!==c.id)return false;
          let completedMs=+t.submittedAt||+t.approvedAt||0;
          return completedMs&&dateKeyFromMs(completedMs)===date&&(t.status==="pending"||t.status==="approved");
        });
        if(done)continue;
        let loss=Math.max(0,+c.missXp||5);
        k.xp=Math.max(0,(+k.xp||0)-loss);
        ledger.push({id:newId(),key,type:"required_miss",kidId:k.id,choreId:c.id,label:`Missed required chore — ${c.name}`,xp:-loss,points:0,cash:0,at:Date.now(),forDate:date,undone:false});
        changed=true;
      }
    }
    if(changed)tr.update(familyRef,{kids,ledger:ledger.slice(-500)});
  });
}

function splitGross(gross,kidId){
 let desiredCash=+(gross*cashPct()/100).toFixed(2);
 let cash=+Math.min(desiredCash,weeklyCashRoom(kidId)).toFixed(2);
 let future=+(gross-cash).toFixed(2);
 return {cash,future}
}
function reliability(k){let d=+k.requiredDue||0,c=+k.requiredDone||0;return d?Math.round(c/d*100):100}
function relClass(r){return r>=90?"good":r>=75?"mid":"low"}

}
function frequencyLabel(c){
  if(c.frequency==="needed")return "when needed";
  if(c.frequency==="everyhours")return `every ${Math.max(1,+c.intervalHours||1)} hours`;
  if(c.frequency==="everyx")return `every ${Math.max(1,+c.intervalDays||7)} days`;
  if(c.frequency==="weekdays")return "weekdays";
  if(c.frequency==="once")return "one-time";
  if(c.frequency==="daily")return "once a day";
  if(c.frequency==="weekly")return "once a week";
  return "anytime";
}
function todayKey(d=new Date()){return `${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,"0")}-${String(d.getDate()).padStart(2,"0")}`}
function mondayKey(d=new Date()){let x=new Date(d),day=(x.getDay()+6)%7;x.setHours(12,0,0,0);x.setDate(x.getDate()-day);return todayKey(x)}
function isWeekend(d=new Date()){let day=d.getDay();return day===0||day===6}
function periodKey(c){
  if(c.frequency==="daily")return todayKey();
  if(c.frequency==="weekdays")return isWeekend()?"weekend-off":todayKey();
  if(c.frequency==="weekly")return mondayKey();
  if(c.frequency==="everyhours")return "everyhours";
  if(c.frequency==="everyx")return "everyx";
  if(c.frequency==="once")return "once";
  if(c.frequency==="needed")return "needed";
  return "any";
}
function lastApprovedFor(c,kidId){
  let arr=(data.tasks||[]).filter(t=>t.choreId===c.id&&t.kidId===kidId&&t.status==="approved");
  arr.sort((a,b)=>(b.approvedAt||0)-(a.approvedAt||0));
  return arr[0]||null;
}
function lastSharedApproved(c){
  let arr=(data.tasks||[]).filter(t=>t.choreId===c.id&&t.status==="approved");
  arr.sort((a,b)=>(b.approvedAt||0)-(a.approvedAt||0));
  return arr[0]||null;
}
function everyXReady(c,kidId){
  let days=Math.max(1,+c.intervalDays||7);
  let t=c.exclusive?lastSharedApproved(c):lastApprovedFor(c,kidId);
  if(!t)return true;
  return (Date.now()-(t.approvedAt||0)) >= days*86400000;
}
function everyHoursReady(c,kidId){
  let hours=Math.max(1,+c.intervalHours||1);
  let t=c.exclusive?lastSharedApproved(c):lastApprovedFor(c,kidId);
  if(!t)return true;
  return (Date.now()-(t.approvedAt||0)) >= hours*3600000;
}
function eligible(c,kidId){return c.active!==false&&(c.assignedTo||[]).includes(kidId)&&!(c.frequency==="weekdays"&&isWeekend())}
function live(c,kidId){let p=periodKey(c);return (data.tasks||[]).find(t=>t.choreId===c.id&&t.kidId===kidId&&["open","pending"].includes(t.status)&&(c.frequency==="anytime"||t.periodKey===p))}
function approved(c,kidId){let p=periodKey(c);return (data.tasks||[]).some(t=>t.choreId===c.id&&t.kidId===kidId&&t.status==="approved"&&(c.frequency==="anytime"||t.periodKey===p))}
function sharedLive(c){let p=periodKey(c);return (data.tasks||[]).find(t=>t.choreId===c.id&&["open","pending"].includes(t.status)&&(c.frequency==="anytime"||t.periodKey===p))}
function sharedApproved(c){let p=periodKey(c);return (data.tasks||[]).some(t=>t.choreId===c.id&&t.status==="approved"&&(c.frequency==="anytime"||t.periodKey===p))}

function lastSharedApprovedAny(c){
  let arr=(data.tasks||[]).filter(t=>t.choreId===c.id&&t.status==="approved");
  arr.sort((a,b)=>(b.approvedAt||0)-(a.approvedAt||0));
  return arr[0]||null;
}
function cooldownReady(c){
  let mins=Math.max(0,+c.cooldownMinutes||0);
  if(!mins)return true;
  let t=lastSharedApprovedAny(c);
  if(!t)return true;
  return Date.now()-(t.approvedAt||0) >= mins*60000;
}
function rewardedClaimsToday(c){
  let start=new Date(); start.setHours(0,0,0,0);
  return (data.tasks||[]).filter(t=>t.choreId===c.id&&t.status==="approved"&&(t.approvedAt||0)>=start.getTime()).length;
}
function canClaim(c,kidId){
  if(!eligible(c,kidId))return false;

  if(c.frequency==="everyhours"){
    if(c.exclusive&&sharedLive(c))return false;
    if(!c.exclusive&&live(c,kidId))return false;
    return everyHoursReady(c,kidId);
  }

  if(c.frequency==="everyx" && !everyXReady(c,kidId))return false;

  if(c.exclusive){
    if(sharedLive(c)||((c.frequency==="daily"||c.frequency==="weekdays"||c.frequency==="weekly"||c.frequency==="once")&&sharedApproved(c)))return false;
  }else{
    if(live(c,kidId)||((c.frequency==="daily"||c.frequency==="weekdays"||c.frequency==="weekly"||c.frequency==="once")&&approved(c,kidId)))return false;
  }
  return true;
}
function pending(){return (data.tasks||[]).filter(t=>t.status==="pending")}
function pendingExcuseRequests(d=data){return (d?.ledger||[]).filter(x=>x.type==="required_miss"&&!x.undone&&x.excuseRequest?.status==="pending")}
function pendingLevelUps(){return challengeLogs().filter(x=>x.status==="pending")}
function waitingApprovalCount(){return pending().length+pendingLevelUps().length+pendingExcuseRequests().length}
function recentApprovals(){
  return (data.tasks||[]).filter(t=>t.status==="approved")
    .sort((a,b)=>(b.approvedAt||0)-(a.approvedAt||0))
    .slice(0,20)
}
function needsSomeone(){
  return library().filter(c=>c.required&&c.exclusive&&["daily","weekdays","weekly","everyx","everyhours"].includes(c.frequency)&&(c.assignedTo||[]).length&&canClaim(c,c.assignedTo[0])&&!sharedLive(c)&&!sharedApproved(c))
}
function requiredLeft(k){
  let chores=library().filter(c=>c.required&&eligible(c,k.id)&&["daily","weekdays","weekly","everyx","everyhours"].includes(c.frequency));
  let left=0;chores.forEach(c=>{if(c.exclusive&&(c.assignedTo||[]).length>1){if(!sharedApproved(c))left++}else if(!approved(c,k.id))left++});return left
}
function challengeLibrary(){
  const saved=Array.isArray(data?.challenges)?data.challenges:[];
  const map=new Map(saved.map(c=>[c.id,c]));
  return DEFAULT_CHALLENGES.map(c=>{
    let x={frequency:"daily",intervalHours:4,intervalDays:1,claimType:"each",rewardPoints:defaultLevelPoints(c.id),...c,...(map.get(c.id)||{})};
    if(x.id==="outside"){x.frequency=x.frequency||"everyhours"; if(!map.has(x.id)){x.frequency="everyhours";x.intervalHours=4}}
    return x;
  });
}
function challengeLogs(){return Array.isArray(data?.challengeLogs)?data.challengeLogs:[]}
function weekDates(){
 let d=new Date(),day=(d.getDay()+6)%7,m=new Date(d);m.setDate(d.getDate()-day);
 return [...Array(7)].map((_,i)=>{let x=new Date(m);x.setDate(m.getDate()+i);return todayKey(x)})
}
function challengeHit(kidId,cid,date=todayKey()){return challengeLogs().some(x=>x.kidId===kidId&&x.challengeId===cid&&x.date===date&&x.status==="approved")}
function challengePending(kidId,cid,date=todayKey()){return challengeLogs().some(x=>x.kidId===kidId&&x.challengeId===cid&&x.date===date&&x.status==="pending")}
function lastChallengeApproval(cid,kidId=null){
  let arr=challengeLogs().filter(x=>x.challengeId===cid&&x.status==="approved"&&(!kidId||x.kidId===kidId));
  arr.sort((a,b)=>(b.approvedAt||0)-(a.approvedAt||0));
  return arr[0]||null;
}
function liveChallenge(cid,kidId=null){
  return challengeLogs().some(x=>x.challengeId===cid&&x.status==="pending"&&(!kidId||x.kidId===kidId));
}
function challengeAvailabilityLabel(c){
  if(c.frequency==="everyhours")return `Every ${Math.max(1,+c.intervalHours||1)} hours`;
  if(c.frequency==="everyx")return `Every ${Math.max(1,+c.intervalDays||1)} days`;
  return ({anytime:"Anytime",daily:"Once a day",weekdays:"Weekdays",weekly:"Once a week",once:"One-time"}[c.frequency]||"Once a day");
}
function challengeAvailable(c,kidId){
  let shared=c.claimType==="shared";
  if(liveChallenge(c.id,shared?null:kidId))return false;
  let last=lastChallengeApproval(c.id,shared?null:kidId);

  if(c.frequency==="everyhours"){
    return !last || Date.now()-(last.approvedAt||0) >= Math.max(1,+c.intervalHours||1)*3600000;
  }
  if(c.frequency==="everyx"){
    return !last || Date.now()-(last.approvedAt||0) >= Math.max(1,+c.intervalDays||1)*86400000;
  }
  if(c.frequency==="weekly"){
    return !last || (last.approvedAt||0)<weekStartMs();
  }
  if(c.frequency==="weekdays"){
    if(isWeekend())return false;
    return !last || todayKey(new Date(last.approvedAt))!==todayKey();
  }
  if(c.frequency==="once")return !last;
  if(c.frequency==="anytime")return true;
  return !last || todayKey(new Date(last.approvedAt))!==todayKey();
}
function pushupPoints(count){return Math.floor(Math.max(0,Math.min(100,+count||0))/20)*5}
function defaultLevelPoints(id){
  // Bigger, all-day or character-driven Level Ups stay more valuable.
  if(["screen","help","awesome"].includes(id))return 10;
  return 5;
}
async function rebalancePointEconomyOnce(){
  if(!isParent() || !data || (+data.pointEconomyVersion||0)>=2)return;
  await runTransaction(db,async tr=>{
    let s=await tr.get(familyRef);
    if(!s.exists())return;
    let d=s.data();
    if((+d.pointEconomyVersion||0)>=2)return;

    const saved=Array.isArray(d.challenges)?d.challenges:[];
    const savedMap=new Map(saved.map(c=>[c.id,c]));
    const merged=DEFAULT_CHALLENGES.map(base=>{
      const old=savedMap.get(base.id)||{};
      return {...base,...old,rewardPoints:base.id==="pushups"?(old.rewardPoints||5):defaultLevelPoints(base.id)};
    });
    // Preserve any custom challenge records that are not built-ins.
    saved.filter(c=>!DEFAULT_CHALLENGES.some(b=>b.id===c.id)).forEach(c=>{
      merged.push({...c,rewardPoints:Math.max(0,+c.rewardPoints||5)});
    });

    tr.update(familyRef,{challenges:merged,pointEconomyVersion:2});
  });
}

function weeklyHits(kidId,cid){let dates=weekDates();return dates.filter(d=>challengeHit(kidId,cid,d)).length}
function streak(kidId,cid){
 let n=0,d=new Date();
 for(let i=0;i<60;i++){let key=todayKey(d);if(challengeHit(kidId,cid,key))n++;else if(i>0)break;d.setDate(d.getDate()-1)}
 return n
}

}

function week(){
 let k=data.kids[kid];
 let active=(data.tasks||[]).filter(t=>t.kidId===k.id&&["open","pending"].includes(t.status));

 // Every required chore that is due now and not already active/completed.
 let due=library().filter(c=>{
   if(!c.required || !eligible(c,k.id)) return false;

   // "When Necessary" is not automatically due; kid can still find it in Chores.
   if(c.frequency==="needed" || c.frequency==="anytime") return false;

   // One-time disappears once approved; otherwise it is due.
   if(c.frequency==="once"){
     return !approved(c,k.id) && !live(c,k.id);
   }

   // Daily / weekdays / weekly / every X days:
   if(c.exclusive){
     if(sharedLive(c) || sharedApproved(c)) return false;
     if(c.frequency==="everyx" && !everyXReady(c,k.id)) return false;
     return true;
   }else{
     if(live(c,k.id) || approved(c,k.id)) return false;
     if(c.frequency==="everyx" && !everyXReady(c,k.id)) return false;
     return true;
   }
 });

 async function bulkExcuseMissRange(startDate,endDate){
   if(!startDate||!endDate)return alert("Choose a start and end date.");
   let a=startDate<=endDate?startDate:endDate,b=startDate<=endDate?endDate:startDate;
   let preview=activeMissesInRange(a,b);
   if(!preview.length)return alert(`No active missed-chore penalties found from ${a} through ${b}.`);
   let totalXp=preview.reduce((sum,x)=>sum+Math.abs(+x.xp||0),0);
   let affected=[...new Set(preview.map(x=>x.kidId))].map(id=>kidById(id)?.name||id).join(", ");
   askConfirm(
     "Excuse missed chores?",
     `This will excuse ${preview.length} missed-chore ${preview.length===1?"penalty":"penalties"} from ${a} through ${b} and restore ${totalXp} XP across ${affected}. Behavior consequences, earnings, Points and approvals will not change.`,
     `Excuse ${preview.length}`,
     async()=>{
       await runTransaction(db,async tr=>{
         let snap=await tr.get(familyRef),d=snap.data();
         let current=activeMissesInRange(a,b,d);
         if(!current.length)return;
         let restoreByKid={};
         current.forEach(m=>restoreByKid[m.kidId]=(restoreByKid[m.kidId]||0)+Math.abs(+m.xp||0));
         let now=Date.now();
         let kids=(d.kids||[]).map(k=>restoreByKid[k.id]?{...k,xp:(+k.xp||0)+restoreByKid[k.id]}:k);
         let ids=new Set(current.map(m=>m.id));
         let ledger=(d.ledger||[]).map(x=>ids.has(x.id)?{...x,undone:true,undoneBy:user.email,undoneAt:now,bulkExcused:true}:x);
         current.forEach(m=>ledger.push({
           id:newId(),type:"miss_reversal",kidId:m.kidId,choreId:m.choreId,
           label:`Excused miss — ${String(m.label||"").replace("Missed required chore — ","")}`,
           note:`Bulk excused by parent for ${m.forDate||""}`,
           xp:Math.abs(+m.xp||0),points:0,cash:0,by:user.email,at:now,reverses:m.id,bulk:true,forDate:m.forDate
         }));
         tr.update(familyRef,{kids,ledger:ledger.slice(-500)});
       });
     }
   );
 }
