function approved(c,kidId){let p=periodKey(c);return (data.tasks||[]).some(t=>t.choreId===c.id&&t.kidId===kidId&&t.status==="approved"&&(c.frequency==="anytime"||t.periodKey===p))}
function sharedLive(c){let p=periodKey(c);return (data.tasks||[]).find(t=>t.choreId===c.id&&["open","pending"].includes(t.status)&&(c.frequency==="anytime"||t.periodKey===p))}
function sharedApproved(c){let p=periodKey(c);return (data.tasks||[]).some(t=>t.choreId===c.id&&t.status==="approved"&&(c.frequency==="anytime"||t.periodKey===p))}
function canClaim(c,kidId){
  if(!eligible(c,kidId))return false;
  if(c.frequency==="everyx" && !everyXReady(c,kidId))return false;
  if(c.exclusive){
    if(sharedLive(c)||((c.frequency==="daily"||c.frequency==="weekdays"||c.frequency==="weekly"||c.frequency==="once")&&sharedApproved(c)))return false;
  }else{
    if(live(c,kidId)||((c.frequency==="daily"||c.frequency==="weekdays"||c.frequency==="weekly"||c.frequency==="once")&&approved(c,kidId)))return false;
  }
  return true;
}
function pending(){return (data.tasks||[]).filter(t=>t.status==="pending")}
function recentApprovals(){
  return (data.tasks||[]).filter(t=>t.status==="approved")
    .sort((a,b)=>(b.approvedAt||0)-(a.approvedAt||0))
    .slice(0,20)
}
function needsSomeone(){
  return library().filter(c=>c.required&&c.exclusive&&["daily","weekdays","weekly","everyx"].includes(c.frequency)&&(c.assignedTo||[]).length&&canClaim(c,c.assignedTo[0])&&!sharedLive(c)&&!sharedApproved(c))
}
function requiredLeft(k){
  let chores=library().filter(c=>c.required&&eligible(c,k.id)&&["daily","weekdays","weekly","everyx"].includes(c.frequency));
  let left=0;chores.forEach(c=>{if(c.exclusive&&(c.assignedTo||[]).length>1){if(!sharedApproved(c))left++}else if(!approved(c,k.id))left++});return left
}
function challengeLibrary(){return Array.isArray(data?.challenges)&&data.challenges.length?data.challenges:DEFAULT_CHALLENGES}
function challengeLogs(){return Array.isArray(data?.challengeLogs)?data.challengeLogs:[]}
function weekDates(){
 let d=new Date(),day=(d.getDay()+6)%7,m=new Date(d);m.setDate(d.getDate()-day);
 return [...Array(7)].map((_,i)=>{let x=new Date(m);x.setDate(m.getDate()+i);return todayKey(x)})
}
function challengeHit(kidId,cid,date=todayKey()){return challengeLogs().some(x=>x.kidId===kidId&&x.challengeId===cid&&x.date===date&&x.status==="approved")}
function challengePending(kidId,cid,date=todayKey()){return challengeLogs().some(x=>x.kidId===kidId&&x.challengeId===cid&&x.date===date&&x.status==="pending")}
function weeklyHits(kidId,cid){let dates=weekDates();return dates.filter(d=>challengeHit(kidId,cid,d)).length}
function streak(kidId,cid){
 let n=0,d=new Date();
 for(let i=0;i<60;i++){let key=todayKey(d);if(challengeHit(kidId,cid,key))n++;else if(i>0)break;d.setDate(d.getDate()-1)}
 return n
}
function levelProgress(k){
 let cs=challengeLibrary().filter(c=>c.target>0),earned=cs.reduce((s,c)=>s+Math.min(weeklyHits(k.id,c.id),c.target),0),goal=cs.reduce((s,c)=>s+c.target,0);
 return {earned,goal};
}

function world(k){let t=theme(k),r=reliability(k),pct=Math.min(100,(+k.car||0)/(+k.target||7500)*100);return `<div class="world ${t[0]}"><div class="wicon">${t[1]}</div><h2>${k.name} — ${t[2]}</h2><div class="wsub">${t[3]}</div><div class="worldBadges"><span class="worldBadge">💵 Owed ${money(cashOwed(k))}</span><span class="worldBadge">🏦 Future Fund ${money(k.car||0)}</span><span class="worldBadge">💰 Week ${money(weeklyGross(k.id))}/${money(weeklyTotalCap())}</span><span class="worldBadge">💵 Cash ${money(weeklyCash(k.id))}/${money(weeklyCashCap())}</span><span class="worldBadge">⭐ ${k.xp||0} XP</span><span class="worldBadge">🎯 ${r}% reliable</span></div><div class="progress" style="margin-top:13px;background:rgba(255,255,255,.45)"><div class="bar" style="width:${pct}%"></div></div><div class="worldBadge" style="margin-top:9px;display:inline-flex">🔥 Weekly Level Up ${levelProgress(k).earned}/${levelProgress(k).goal}</div></div>`}

function week(){
 let k=data.kids[kid];
 let active=(data.tasks||[]).filter(t=>t.kidId===k.id&&["open","pending"].includes(t.status));

 // Every required chore that is due now and not already active/completed.
 let due=library().filter(c=>{
   if(!c.required || !eligible(c,k.id)) return false;

   // "When Necessary" is not automatically due; kid can still find it in Chores.
   if(c.frequency==="needed" || c.frequency==="anytime") return false;

   // One-time disappears once approved; otherwise it is due.
   if(c.frequency==="once"){
     return !approved(c,k.id) && !live(c,k.id);
   }

   // Daily / weekdays / weekly / every X days:
   if(c.exclusive){
     if(sharedLive(c) || sharedApproved(c)) return false;
     if(c.frequency==="everyx" && !everyXReady(c,k.id)) return false;
     return true;
   }else{
     if(live(c,k.id) || approved(c,k.id)) return false;
     if(c.frequency==="everyx" && !everyXReady(c,k.id)) return false;
     return true;
   }
 });

 return header()+world(k)+`<div class="card">
   <div class="row wrap">
     <div>
       <h2 style="margin:0">✅ My Missions</h2>
       <div class="muted">Everything ${k.name} needs to handle right now.</div>
     </div>
     <select id="kidSel" style="width:auto;min-width:150px">
       ${data.kids.map((x,i)=>`<option value="${i}" ${i===kid?"selected":""}>${x.name}</option>`).join("")}
     </select>
   </div>

   ${due.length?`
   <div class="notice warn" style="margin-top:13px">
     <b>⏰ Due Now</b>
     ${due.map(c=>`<div class="task">
       <div>
         <b>${c.icon} ${c.name}</b>
         <div class="reward">${frequencyLabel(c)} · ${c.paid?`paid job`:`responsibility`}</div>
       </div>
       <button class="btn small" data-quick="${c.id}">Start</button>
     </div>`).join("")}
   </div>`:""}

   <div style="margin-top:12px">
   ${active.length?active.map(t=>`<div class="task">
     <div>
       <b>${t.icon} ${t.name}</b>
       <div class="reward">${t.type==="golf"?`${t.count||0} balls · `:""}${isKidSession()?"Parent sets reward":`💵 ${money(t.cash)} · 🚗 ${money(t.car)}`}</div>
       <div class="status ${t.status}">${t.status==="open"?"IN PROGRESS":"WAITING FOR PARENT"}</div>
     </div>
     ${t.status==="open"
       ?`<button data-done="${t.id}" class="btn">${t.type==="golf"?"Count Balls":"I Did It!"}</button>`
       :`<span class="pill due">Submitted</span>`}
   </div>`).join(""):`${due.length?"":`<p class="muted">Nothing due right now. 🎉</p>`}`}
   </div>

   ${undoBanner()}
 </div>`;
}

let confirmAction=null;
function askConfirm(title,body,okLabel,action){
  confirmAction=action;
  document.body.insertAdjacentHTML("beforeend",`<div id="confirmBox" class="confirmBox"><div class="confirmCard"><h2 style="margin-top:0">${title}</h2><p class="muted">${body}</p><div class="actions" style="justify-content:flex-end"><button id="confirmCancel" class="btn secondary">Cancel</button><button id="confirmOk" class="btn">${okLabel}</button></div></div></div>`);
  $("#confirmCancel").onclick=()=>{confirmAction=null;$("#confirmBox").remove()};
  $("#confirmOk").onclick=async()=>{let fn=confirmAction;confirmAction=null;$("#confirmBox").remove();if(fn)await fn()};
}
function undoBanner(){
