<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#143a2a">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="Risser Rewards">
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="icon-192.png">
<title>Risser Rewards</title>
<style>
:root{--bg:#f6f4ea;--card:#fff;--ink:#182018;--muted:#70766e;--green:#226a43;--green2:#dcefdc;--gold:#d8aa39;--gold2:#fff3cf;--blue:#4c7895;--red:#b55345;--line:#e2e5dc;--shadow:0 12px 30px rgba(30,55,35,.10)}
*{box-sizing:border-box}body{margin:0;background:linear-gradient(180deg,#f8f6ec 0,#edf5ec 100%);color:var(--ink);font-family:ui-rounded,system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}
button,input,select,textarea{font:inherit}button{min-height:44px;cursor:pointer}.app{max-width:1180px;margin:auto;padding:18px 16px 48px}
.top{display:flex;justify-content:space-between;align-items:center;gap:14px;flex-wrap:wrap}.brand{display:flex;gap:12px;align-items:center}.logo{width:56px;height:56px;border-radius:18px;background:linear-gradient(145deg,var(--green),#3e8b5a);display:grid;place-items:center;font-size:30px;box-shadow:var(--shadow)}h1{margin:0;font-size:clamp(30px,5vw,50px);letter-spacing:-.05em}.tag{color:var(--muted);margin-top:2px}.btn{border:0;border-radius:14px;padding:10px 14px;font-weight:800;background:var(--green);color:#fff}.btn.secondary{background:#fff;color:var(--ink);border:1px solid var(--line)}.btn.gold{background:var(--gold);color:#fff}.btn.red{background:var(--red)}.btn.small{min-height:38px;padding:7px 10px;font-size:14px}
.tabs{display:flex;gap:8px;flex-wrap:wrap;margin:16px 0}.tab{border:1px solid var(--line);background:#fff;border-radius:999px;padding:9px 14px;color:var(--ink)}.tab.active{background:var(--green);color:#fff;border-color:var(--green)}
.grid{display:grid;grid-template-columns:repeat(12,minmax(0,1fr));gap:14px}.card{background:rgba(255,255,255,.96);border:1px solid rgba(225,230,220,.95);border-radius:22px;padding:17px;box-shadow:var(--shadow)}.kid{grid-column:span 6}.full{grid-column:1/-1}.third{grid-column:span 4}.quarter{grid-column:span 3}
.hero{display:grid;grid-template-columns:1.2fr .8fr;gap:14px}.quest{background:linear-gradient(145deg,#e5f3e3,#fff2cb);position:relative;overflow:hidden}.quest:after{content:"⭐";position:absolute;right:16px;top:10px;font-size:72px;opacity:.14}.row{display:flex;align-items:center;justify-content:space-between;gap:12px}.wrap{flex-wrap:wrap}.muted{color:var(--muted)}.tiny{font-size:12px}.metric{font-size:30px;font-weight:900;letter-spacing:-.04em}.avatar{width:54px;height:54px;border-radius:18px;background:var(--green2);display:grid;place-items:center;font-weight:950;font-size:19px}.progress{height:12px;background:#edf0e9;border-radius:999px;overflow:hidden}.bar{height:100%;background:linear-gradient(90deg,var(--green),#7dbf88,var(--gold));border-radius:999px}.badge{display:inline-flex;align-items:center;gap:4px;padding:5px 9px;border-radius:999px;background:#f1f4ef;font-size:12px;font-weight:850}.badge.gold{background:var(--gold2)}
.task{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:12px;align-items:center;padding:14px 0;border-top:1px solid #edf0ea}.task:first-child{border-top:0}.taskname{font-weight:850}.reward{font-size:13px;color:var(--muted);margin-top:3px}.status{font-size:11px;font-weight:900;text-transform:uppercase;letter-spacing:.07em;margin-top:5px}.pending{color:#936d12}.approved{color:var(--green)}
.formgrid{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:10px}label{display:block;font-size:13px;font-weight:850;margin-bottom:6px}input,select,textarea{width:100%;min-height:44px;border:1px solid #cfd7cc;border-radius:12px;background:#fff;color:var(--ink);padding:10px 11px;font-size:16px}textarea{min-height:78px;resize:vertical}.approval{display:flex;justify-content:space-between;align-items:center;gap:12px;padding:13px 0;border-top:1px solid #edf0ea}.approval:first-child{border-top:0}.actions{display:flex;gap:8px;flex-wrap:wrap}.notice{background:var(--green2);padding:12px 13px;border-radius:14px;margin-top:12px}.goldbox{background:var(--gold2);padding:14px;border-radius:16px}
.stars{font-size:24px;letter-spacing:2px}.ballHero{text-align:center;font-size:64px}.counter{display:flex;align-items:center;justify-content:center;gap:15px;margin:14px 0}.counter button{width:56px;height:56px;border:0;border-radius:50%;background:var(--green);color:#fff;font-size:28px}.count{min-width:90px;text-align:center;font-size:46px;font-weight:950}.library{max-height:520px;overflow:auto}.librow{display:grid;grid-template-columns:1.3fr .7fr .45fr .45fr;gap:8px;align-items:center;padding:10px 0;border-top:1px solid #edf0ea}
.toast{position:sticky;bottom:14px;margin:16px auto 0;max-width:520px;background:#173b2b;color:white;padding:12px 14px;border-radius:16px;text-align:center;font-weight:850;box-shadow:var(--shadow);display:none}.toast.show{display:block;animation:pop .25s ease-out}@keyframes pop{from{transform:scale(.95);opacity:.4}to{transform:scale(1);opacity:1}}
.confetti{position:fixed;pointer-events:none;inset:0;overflow:hidden}.confetti span{position:absolute;top:-20px;font-size:18px;animation:fall 1.4s linear forwards}@keyframes fall{to{transform:translateY(105vh) rotate(520deg);opacity:.2}}
@media(max-width:780px){.kid,.third,.quarter{grid-column:1/-1}.hero{grid-template-columns:1fr}.formgrid{grid-template-columns:1fr 1fr}.librow{grid-template-columns:1fr 1fr}}@media(max-width:480px){.app{padding:12px 10px 40px}.formgrid{grid-template-columns:1fr}.task{grid-template-columns:1fr}.approval{flex-direction:column;align-items:flex-start}.librow{grid-template-columns:1fr}}
</style>
</head>
<body>
<div id="root" class="app"></div>
<div id="confetti" class="confetti" aria-hidden="true"></div>
<script>
(()=>{
const KEY="risserRewardsV12";
const CHORES=[
["Make bed","Basic","daily",0,0,"Bed made neatly."],["Keep bedroom clean","Maintain","maintain",0,0,"Floor clear, clothes put away, surfaces reasonably clean."],["Put shoes away","Basic","daily",0,0,"Shoes go in their assigned spot."],["Empty lunch box","Basic","daily",0,0,"Empty after school; food put away or thrown out."],["Clean lunch dishes","Basic","daily",0,0,"Reusable containers and utensils rinsed/cleaned."],["Put backpack away","Basic","daily",0,0,"Backpack goes in the basket."],["Put homework/schoolwork away","Basic","daily",0,0,"Homework, papers and supplies back in backpack or assigned spot."],["Put away coloring/craft supplies","Basic","after use",0,0,"Crayons, paper, markers and supplies fully put away."],["Keep living room clean","Maintain","maintain",0,0,"Keep it picked up through the week, not just once."],["Clear living room counters/tables","Basic","daily",0,0,"No cups, toys, papers or random stuff left behind."],
["Fold own clothes","Easy","weekly",1,2,"Fold neatly."],["Put away own clothes","Easy","weekly",1,2,"Put in correct drawers/closet."],["Full laundry load","Medium","weekly",3,5,"Wash, dry, fold and put away."],["Load dishwasher","Easy","as needed",1,2,"Load correctly."],["Unload dishwasher","Easy","as needed",1,2,"Everything put in the right place."],["Hand wash dishes","Medium","as needed",2,3,"Wash and leave sink area clean."],["Clean kitchen table","Easy","daily",1,2,"Clear and wipe entire table."],["Take out trash if full","Easy","as needed",1,2,"Take out and install new bag."],["Take cardboard to recycle bin","Easy","as needed",1,2,"Break down boxes and take to recycling."],
["Feed dog and cat","Easy","daily",.5,1,"Correct amount; check water."],["Clean dog water bowl","Easy","weekly",1,2,"Dump, scrub/rinse and refill."],["Clean cat water bowl","Easy","weekly",1,2,"Dump, scrub/rinse and refill."],["Clean litter box","Medium","assigned",1.5,2.5,"Scoop thoroughly and clean around box."],["Feed goats","Medium","daily",1.5,2.5,"1 scoop feed split between all 3 + 1 flake hay."],["Collect eggs","Easy","daily",1,1.5,"Collect and put away safely."],["Clean duck pond","Big Job","as needed",5,8,"Clean and refill; parent verifies."],["Pick up dog poop","Medium","weekly",3,5,"Entire assigned area checked."],["Clean snake cages","Big Job","assigned",4,6,"Follow parent-approved process; parent verifies."],
["Patio reset","Medium","as needed",2,3,"Pick up, trash out, items returned."],["Pool towels reset","Easy","after swimming",1,2,"Hang wet towels; fold/put away dry towels."],["Clean pool toys","Medium","weekly",2,3,"Gather, rinse if needed, organize and store."],["Sports gear reset","Easy","as needed",1,2,"Basketballs, footballs, wiffle balls, bats and gear put away."],["Full yard sports reset","Medium","optional",2,3,"Sports gear and outdoor toys all picked up."],
["Sweep","Easy","weekly",1.5,2.5,"Assigned area including edges."],["Mop","Medium","weekly",2.5,4,"Sweep first, then mop."],["Dust","Easy","weekly",1.5,2.5,"Assigned surfaces completely dusted."],["Clean bathroom","Big Job","weekly",4,6,"Toilet, sink, mirror, counters and floor."],["Clean Mom/Dad car","Big Job","weekly",4,6,"Trash out, organize, wipe surfaces, vacuum."],["Wash car","Big Job","optional",5,8,"Wash exterior and put supplies away."],["Wash go-kart","Medium","optional",3,5,"Wash, dry, put supplies away."],["Pull weeds — 30 min","Medium","optional",3,5,"Work steadily for 30 minutes."],["Clean/organize garage","Big Job","optional",7,10,"Parent assigns area; organize and sweep."],["Bible verse of the week","Growth","weekly",1,3,"Recite and explain what it means."],["Golf Ball Bounty","Bounty","optional",0,0,"Count balls returned to the golf-ball bucket."]
];
function kid(name,age){return{name,age,cash:0,car:0,target:7500,streak:0,xp:0,assignments:[],history:[],grades:[]}}
let s=load()||{pin:"2468",kids:[kid("Noah",10),kid("Eli",10),kid("Shepherd",8),kid("Juniper",5)],library:CHORES.map((x,i)=>({id:"c"+i,name:x[0],level:x[1],freq:x[2],cash:x[3],car:x[4],done:x[5]})),golf:{cash:.05,car:.10},selected:0,parent:false,view:"home"};
function load(){try{return JSON.parse(localStorage.getItem(KEY))}catch(e){return null}}function save(){localStorage.setItem(KEY,JSON.stringify(s))}
const $=q=>document.querySelector(q), $$=q=>[...document.querySelectorAll(q)], esc=t=>String(t).replace(/[&<>"']/g,m=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[m])), money=n=>"$"+Number(n||0).toFixed(Number(n)%1?2:0), uid=()=>Date.now().toString(36)+Math.random().toString(36).slice(2,6);
function current(){return s.kids[s.selected]}function pend(){return s.kids.flatMap((k,ki)=>k.assignments.filter(a=>a.status==="pending").map(a=>({k,ki,a})))}
function level(k){if(k.xp>=250)return["🏆","Boss"];if(k.xp>=150)return["⭐","Pro"];if(k.xp>=80)return["💪","Hustler"];if(k.xp>=30)return["🔨","Reliable"];return["🌱","Rookie"]}
function top(){return `<div class="top"><div class="brand"><div class="logo">🚙</div><div><h1>Risser Rewards</h1><div class="tag">Work hard. Earn it. Build your future.</div></div></div><button id="parentBtn" class="btn secondary">${s.parent?"🔓 Exit Parent Mode":"🔒 Parent Mode"}</button></div><div class="tabs"><button class="tab ${s.view==="home"?"active":""}" data-view="home">🏠 Family</button><button class="tab ${s.view==="kid"?"active":""}" data-view="kid">✅ My Week</button>${s.parent?`<button class="tab ${s.view==="approve"?"active":""}" data-view="approve">👍 Approvals ${pend().length?`(${pend().length})`:""}</button><button class="tab ${s.view==="manage"?"active":""}" data-view="manage">⚙️ Manage</button><button class="tab ${s.view==="library"?"active":""}" data-view="library">🧰 Chore Bank</button>`:""}</div>`}
function kidCard(k,i){let pct=Math.min(100,Math.round(k.car/k.target*100)), lv=level(k),approved=k.assignments.filter(a=>a.status==="approved").length;return `<section class="card kid"><div class="row"><div class="row" style="justify-content:flex-start"><div class="avatar">${esc(k.name).slice(0,2).toUpperCase()}</div><div><div style="font-weight:900">${esc(k.name)}</div><div class="tiny muted">${lv[0]} ${lv[1]} · 🔥 ${k.streak} week streak</div></div></div><button class="btn secondary small" data-kid="${i}">Open</button></div><div class="row wrap" style="margin-top:14px"><span><b>${approved}/${k.assignments.length}</b> done</span><span><b>${money(k.cash)}</b> cash</span><span><b>${k.xp}</b> XP</span></div><div class="progress" style="margin:12px 0 7px"><div class="bar" style="width:${pct}%"></div></div><div class="tiny muted">🚗 ${money(k.car)} of ${money(k.target)} future car goal</div></section>`}
function home(){let car=s.kids.reduce((a,k)=>a+k.car,0), cash=s.kids.reduce((a,k)=>a+k.cash,0);return `${top()}<div class="hero"><section class="card"><h2 style="margin-top:0">Family Scoreboard</h2><div class="grid"><div class="card quarter"><div class="tiny muted">Waiting approval</div><div class="metric">${pend().length}</div></div><div class="card quarter"><div class="tiny muted">Car funds</div><div class="metric">${money(car)}</div></div><div class="card quarter"><div class="tiny muted">Cash earned</div><div class="metric">${money(cash)}</div></div><div class="card quarter"><div class="tiny muted">Total XP</div><div class="metric">${s.kids.reduce((a,k)=>a+k.xp,0)}</div></div></div></section><section class="card quest"><div style="font-size:46px">🎯</div><h2 style="margin:4px 0">Family Quest</h2><div class="muted">Responsibility unlocks bigger jobs, more trust, and more earning power.</div></section></div><div class="grid" style="margin-top:14px">${s.kids.map(kidCard).join("")}</div>`}
function task(a){let special=a.type==="golf";return `<div class="task"><div><div class="taskname">${esc(a.name)}</div><div class="reward">${special?`⛳ ${a.count||0} balls · `:""}💵 ${money(a.cash)} · 🚗 ${money(a.car)}</div>${a.done?`<div class="tiny muted">${esc(a.done)}</div>`:""}<div class="status ${a.status}">${a.status==="open"?"Ready":a.status==="pending"?"Waiting for parent":a.status==="approved"?"Approved ✓":"Ready"}</div></div>${a.status==="open"?(special?`<button class="btn gold small" data-golf="${a.id}">Count Balls</button>`:`<button class="btn small" data-done="${a.id}">I Did It!</button>`):`<button class="btn secondary small" disabled>${a.status==="pending"?"Submitted":"Earned!"}</button>`}</div>`}
function kidView(){let k=current(),lv=level(k),pct=Math.min(100,Math.round(k.car/k.target*100));return `${top()}<section class="card"><div class="row wrap"><div><h2 style="margin:0">${esc(k.name)}'s Week</h2><div class="stars">${lv[0]} ${lv[1]}</div><div class="muted tiny">${k.xp} XP · 🔥 ${k.streak} week streak</div></div><select id="kidSelect" style="width:auto;min-width:150px">${s.kids.map((x,i)=>`<option value="${i}" ${i===s.selected?"selected":""}>${esc(x.name)}</option>`).join("")}</select></div><div class="grid" style="margin-top:14px"><div class="card third"><div class="tiny muted">💵 Cash earned</div><div class="metric">${money(k.cash)}</div></div><div class="card third"><div class="tiny muted">🚗 Car fund</div><div class="metric">${money(k.car)}</div></div><div class="card third"><div class="tiny muted">⚡ XP</div><div class="metric">${k.xp}</div></div></div><div class="goldbox" style="margin-top:14px"><div class="row"><b>Road to the Ride</b><b>${pct}%</b></div><div class="progress" style="margin-top:8px"><div class="bar" style="width:${pct}%"></div></div></div><div style="margin-top:12px">${k.assignments.length?k.assignments.map(task).join(""):`<div class="muted">No chores assigned yet. Parent Mode can build the week.</div>`}</div></section>`}
function approvals(){let p=pend();return `${top()}<section class="card"><h2 style="margin-top:0">Parent Approvals</h2>${p.length?p.map(({k,ki,a})=>`<div class="approval"><div><b>${esc(k.name)} — ${esc(a.name)}</b><div class="reward">${a.type==="golf"?`${a.count} balls · `:""}${money(a.cash)} cash + ${money(a.car)} car + 10 XP</div></div><div class="actions"><button class="btn small" data-approve="${ki}|${a.id}">Approve</button><button class="btn red small" data-reject="${ki}|${a.id}">Send Back</button></div></div>`).join(""):`<div class="muted">Nothing waiting. 🎉</div>`}</section>`}
function manage(){return `${top()}<div class="grid"><section class="card full"><h2 style="margin-top:0">Build This Week</h2><form id="assignForm" class="formgrid"><div><label>Kid</label><select name="kid">${s.kids.map((k,i)=>`<option value="${i}">${esc(k.name)}</option>`).join("")}</select></div><div><label>Chore</label><select name="chore">${s.library.map(c=>`<option value="${c.id}">${esc(c.name)}</option>`).join("")}</select></div><div><label>Cash override</label><input name="cash" type="number" min="0" step=".25" placeholder="Default"></div><div><label>Car override</label><input name="car" type="number" min="0" step=".25" placeholder="Default"></div><div class="full"><button class="btn">Add Chore</button></div></form></section><section class="card full"><h2 style="margin-top:0">Grade Bonus</h2><form id="gradeForm" class="formgrid"><div><label>Kid</label><select name="kid">${s.kids.map((k,i)=>`<option value="${i}">${esc(k.name)}</option>`).join("")}</select></div><div><label>Grade</label><select name="grade"><option>A</option><option>B</option><option>C</option></select></div><div><label>Car bonus</label><input name="amount" type="number" min="0" value="100"></div><div style="align-self:end"><button class="btn gold">Add Bonus</button></div></form></section><section class="card full"><h2 style="margin-top:0">Kids & Goals</h2>${s.kids.map((k,i)=>`<div class="approval"><div style="flex:1;display:grid;grid-template-columns:1fr 100px 150px;gap:8px"><div><label>Name</label><input data-name="${i}" value="${esc(k.name)}"></div><div><label>Age</label><input data-age="${i}" type="number" value="${k.age}"></div><div><label>Car Goal</label><input data-target="${i}" type="number" step="500" value="${k.target}"></div></div></div>`).join("")}</section><section class="card full"><h2 style="margin-top:0">Golf Ball Bounty</h2><div class="formgrid"><div><label>Cash / ball</label><input id="gCash" type="number" step=".01" value="${s.golf.cash}"></div><div><label>Car / ball</label><input id="gCar" type="number" step=".01" value="${s.golf.car}"></div></div></section><section class="card full"><h2 style="margin-top:0">Weekly Reset</h2><div class="muted">Clears assignments but keeps lifetime cash, car-fund and XP totals.</div><button id="resetWeek" class="btn red" style="margin-top:10px">Reset Week</button></section></div>`}
function library(){return `${top()}<section class="card"><div class="row wrap"><div><h2 style="margin:0">Master Chore Bank</h2><div class="muted">${s.library.length} chores ready to assign</div></div><span class="badge gold">🧰 Chore Menu</span></div><div class="library">${s.library.map(c=>`<div class="librow"><div><b>${esc(c.name)}</b><div class="tiny muted">${esc(c.done)}</div></div><div><span class="badge">${esc(c.level)}</span><div class="tiny muted">${esc(c.freq)}</div></div><div><label>Cash</label><input data-lc="${c.id}" type="number" step=".25" value="${c.cash}"></div><div><label>Car</label><input data-lr="${c.id}" type="number" step=".25" value="${c.car}"></div></div>`).join("")}</div></section>`}
function lock(){return `<section class="card" style="max-width:430px;margin:40px auto;text-align:center"><div style="font-size:56px">🔐</div><h2>Parent Mode</h2><div class="muted">Approve work, assign chores and manage rewards.</div><form id="pinForm" style="margin-top:14px"><input name="pin" inputmode="numeric" maxlength="8" placeholder="Parent PIN"><button class="btn" style="width:100%;margin-top:10px">Unlock</button></form><div class="notice tiny">First version PIN: <b>2468</b></div></section>`}
let golfId=null;
function golf(){let a=current().assignments.find(x=>x.id===golfId);return `${top()}<section class="card" style="max-width:560px;margin:auto"><div class="ballHero">⛳</div><h2 style="text-align:center;margin:0">Golf Ball Bounty</h2><div class="muted" style="text-align:center">How many did you capture?</div><div class="counter"><button data-count="-1">−</button><div id="count" class="count">${a.count||0}</div><button data-count="1">+</button></div><div class="goldbox"><div class="row"><span>💵 Cash</span><b id="cash">${money(a.cash)}</b></div><div class="row" style="margin-top:7px"><span>🚗 Car fund</span><b id="car">${money(a.car)}</b></div></div><div class="actions" style="justify-content:center;margin-top:14px"><button id="submitGolf" class="btn">Submit Bounty</button><button id="cancelGolf" class="btn secondary">Cancel</button></div></section>`}
function toast(msg){let t=$("#toast");if(!t)return;t.textContent=msg;t.classList.add("show");setTimeout(()=>t.classList.remove("show"),1800)}
function celebrate(){let c=$("#confetti"),chars=["🎉","⭐","💵","🚗","🔥"];for(let i=0;i<28;i++){let s=document.createElement("span");s.textContent=chars[i%chars.length];s.style.left=(Math.random()*100)+"%";s.style.animationDelay=(Math.random()*.4)+"s";c.appendChild(s);setTimeout(()=>s.remove(),1800)}}
function render(){let out=s.view==="home"?home():s.view==="kid"?kidView():s.view==="approve"?approvals():s.view==="manage"?manage():s.view==="library"?library():s.view==="lock"?lock():s.view==="golf"?golf():home();$("#root").innerHTML=out+`<div id="toast" class="toast"></div>`;bind()}
function bind(){
$$("[data-view]").forEach(b=>b.onclick=()=>{s.view=b.dataset.view;save();render()});
let pb=$("#parentBtn");if(pb)pb.onclick=()=>{if(s.parent){s.parent=false;s.view="home"}else s.view="lock";save();render()};
$$("[data-kid]").forEach(b=>b.onclick=()=>{s.selected=+b.dataset.kid;s.view="kid";save();render()});
let ks=$("#kidSelect");if(ks)ks.onchange=()=>{s.selected=+ks.value;save();render()};
$$("[data-done]").forEach(b=>b.onclick=()=>{let a=current().assignments.find(x=>x.id===b.dataset.done);a.status="pending";save();toast("Sent to Parent for approval! 🙌");setTimeout(render,500)});
$$("[data-golf]").forEach(b=>b.onclick=()=>{golfId=b.dataset.golf;s.view="golf";render()});
let pf=$("#pinForm");if(pf)pf.onsubmit=e=>{e.preventDefault();if(new FormData(pf).get("pin")===s.pin){s.parent=true;s.view="approve";save();render()}else alert("Wrong PIN")};
$$("[data-approve]").forEach(b=>b.onclick=()=>{let [ki,id]=b.dataset.approve.split("|"),k=s.kids[+ki],a=k.assignments.find(x=>x.id===id);if(a&&a.status==="pending"){a.status="approved";k.cash+=+a.cash;k.car+=+a.car;k.xp+=10;k.history.push({date:new Date().toISOString(),name:a.name,cash:a.cash,car:a.car});save();celebrate();toast(`${k.name} earned it! 🎉`);setTimeout(render,900)}});
$$("[data-reject]").forEach(b=>b.onclick=()=>{let [ki,id]=b.dataset.reject.split("|"),a=s.kids[+ki].assignments.find(x=>x.id===id);if(a)a.status="open";save();render()});
let af=$("#assignForm");if(af)af.onsubmit=e=>{e.preventDefault();let f=new FormData(af),ki=+f.get("kid"),c=s.library.find(x=>x.id===f.get("chore")),isGolf=c.name==="Golf Ball Bounty";s.kids[ki].assignments.push({id:uid(),name:c.name,cash:f.get("cash")===""?c.cash:+f.get("cash"),car:f.get("car")===""?c.car:+f.get("car"),done:c.done,status:"open",type:isGolf?"golf":"normal",count:0});s.selected=ki;s.view="kid";save();render()};
let gf=$("#gradeForm");if(gf)gf.onsubmit=e=>{e.preventDefault();let f=new FormData(gf),k=s.kids[+f.get("kid")],amt=+f.get("amount")||0;k.car+=amt;k.xp+=20;k.grades.push({grade:f.get("grade"),amount:amt,date:new Date().toISOString()});save();celebrate();render()};
$$("[data-name]").forEach(i=>i.onchange=()=>{s.kids[+i.dataset.name].name=i.value.trim()||s.kids[+i.dataset.name].name;save()});
$$("[data-age]").forEach(i=>i.onchange=()=>{s.kids[+i.dataset.age].age=Math.max(3,Math.min(18,+i.value||5));save()});
$$("[data-target]").forEach(i=>i.onchange=()=>{s.kids[+i.dataset.target].target=Math.max(1000,+i.value||7500);save()});
$$("[data-lc]").forEach(i=>i.onchange=()=>{s.library.find(x=>x.id===i.dataset.lc).cash=Math.max(0,+i.value||0);save()});
$$("[data-lr]").forEach(i=>i.onchange=()=>{s.library.find(x=>x.id===i.dataset.lr).car=Math.max(0,+i.value||0);save()});
let gc=$("#gCash");if(gc)gc.onchange=()=>{s.golf.cash=Math.max(0,+gc.value||0);save()};let gr=$("#gCar");if(gr)gr.onchange=()=>{s.golf.car=Math.max(0,+gr.value||0);save()};
let rw=$("#resetWeek");if(rw)rw.onclick=()=>{if(confirm("Reset weekly chores for everyone? Lifetime totals stay.")){s.kids.forEach(k=>k.assignments=[]);save();render()}};
$$("[data-count]").forEach(b=>b.onclick=()=>{let a=current().assignments.find(x=>x.id===golfId);a.count=Math.max(0,Math.min(200,(a.count||0)+(+b.dataset.count)));a.cash=+(a.count*s.golf.cash).toFixed(2);a.car=+(a.count*s.golf.car).toFixed(2);$("#count").textContent=a.count;$("#cash").textContent=money(a.cash);$("#car").textContent=money(a.car);save()});
let sg=$("#submitGolf");if(sg)sg.onclick=()=>{let a=current().assignments.find(x=>x.id===golfId);if(!a.count)return alert("Count at least one ball.");a.status="pending";s.view="kid";save();render()};let cg=$("#cancelGolf");if(cg)cg.onclick=()=>{s.view="kid";render()};
}
render();
if("serviceWorker" in navigator){window.addEventListener("load",()=>navigator.serviceWorker.register("./sw.js").catch(()=>{}))}
})();
</script>
</body>
</html>
