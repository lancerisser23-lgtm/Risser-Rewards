<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#174c38"><meta name="apple-mobile-web-app-capable" content="yes">
<link rel="manifest" href="manifest.webmanifest"><title>Risser Rewards</title>
<style>
:root{--g:#1e6848;--bg:#f7f5ef;--ink:#182019;--muted:#6c756e;--line:#e2e6df;--gold:#d9a72e;--red:#b84e46}
*{box-sizing:border-box}body{margin:0;background:var(--bg);font-family:ui-rounded,system-ui,-apple-system,sans-serif;color:var(--ink)}
.app{max-width:1100px;margin:auto;padding:16px 14px 55px}.top{display:flex;justify-content:space-between;gap:12px;align-items:center;flex-wrap:wrap}
.brand{font-size:clamp(29px,5vw,48px);font-weight:950;letter-spacing:-.05em}.sub{color:var(--muted)}
button,input,select{font:inherit}.btn{border:0;border-radius:15px;padding:11px 15px;min-height:46px;font-weight:900;background:var(--g);color:#fff}.secondary{background:#fff;color:var(--ink);border:1px solid var(--line)}.red{background:var(--red)}
.tabs{display:flex;gap:8px;flex-wrap:wrap;margin:16px 0}.tab{border:1px solid var(--line);border-radius:999px;background:#fff;padding:9px 13px}.tab.on{background:var(--g);color:#fff}
.card{background:#fff;border:1px solid var(--line);border-radius:22px;padding:16px;box-shadow:0 10px 28px rgba(30,70,45,.09);margin-bottom:13px}
.grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:13px}.kidhero{padding:20px;border-radius:24px;margin-bottom:14px;position:relative;overflow:hidden}
.noah{background:linear-gradient(145deg,#dbe8f3,#edf2f5)}.eli{background:linear-gradient(145deg,#ffe7a8,#f5c65e)}.shepherd{background:linear-gradient(145deg,#d8efd0,#aeddad)}.juniper{background:linear-gradient(135deg,#ffdcec,#efd8ff,#d9f0ff,#fff0a5)}
.big{font-size:64px}.kidhero h2{font-size:30px;margin:2px 0}.row{display:flex;align-items:center;justify-content:space-between;gap:10px}.wrap{flex-wrap:wrap}
.metric{font-size:30px;font-weight:950}.tiny{font-size:12px}.muted{color:var(--muted)}.progress{height:13px;background:#edf0e9;border-radius:999px;overflow:hidden}.bar{height:100%;background:linear-gradient(90deg,#3d8058,#a6cf87,#d6ae3d)}
.chores{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:11px}.chore{border:2px solid #edf0e8;background:#fff;border-radius:20px;padding:12px 8px;text-align:center}.chore:disabled{opacity:.48}.icon{font-size:48px}.name{font-weight:900;font-size:14px;margin-top:5px}.reward{font-size:12px;color:var(--muted);margin-top:4px}
.task,.approval{display:flex;justify-content:space-between;gap:12px;align-items:center;padding:13px 0;border-top:1px solid var(--line)}.task:first-child,.approval:first-child{border-top:0}
.status{font-size:11px;font-weight:950;text-transform:uppercase;margin-top:5px}.pending{color:#987016}.approved{color:var(--g)}
.login{text-align:center;max-width:520px;margin:50px auto}.google{background:#fff;color:#222;border:1px solid #d8ddd8}.notice{background:#e5f1e6;border-radius:14px;padding:12px;margin-top:12px}.warn{background:#fff0cc}
input{width:100%;min-height:45px;border:1px solid #cfd6ce;border-radius:12px;padding:10px 11px;font-size:16px}.actions{display:flex;gap:8px;flex-wrap:wrap}
.badge{display:inline-block;background:rgba(255,255,255,.62);padding:6px 9px;border-radius:999px;font-size:12px;font-weight:900;margin:4px 3px 0 0}
.count{font-size:48px;font-weight:950}.counter{display:flex;justify-content:center;align-items:center;gap:15px;margin:16px}.counter button{width:58px;height:58px;border-radius:50%;border:0;background:var(--g);color:#fff;font-size:28px}
@media(max-width:800px){.chores{grid-template-columns:repeat(3,1fr)}}@media(max-width:600px){.grid{grid-template-columns:1fr}.chores{grid-template-columns:repeat(2,1fr)}.task,.approval{align-items:flex-start;flex-direction:column}.big{font-size:58px}}
</style>
</head>
<body><div id="app" class="app"></div>
<script type="module">
import {initializeApp} from "https://www.gstatic.com/firebasejs/12.2.1/firebase-app.js";
import {getAuth,GoogleAuthProvider,signInWithPopup,signInWithRedirect,getRedirectResult,onAuthStateChanged,signOut} from "https://www.gstatic.com/firebasejs/12.2.1/firebase-auth.js";
import {getFirestore,doc,getDoc,setDoc,onSnapshot,updateDoc,arrayUnion,runTransaction,serverTimestamp} from "https://www.gstatic.com/firebasejs/12.2.1/firebase-firestore.js";

const cfg={"apiKey": "AIzaSyANYgm-DS1jn-l800em4oz2Kp7a9etH2Bg", "authDomain": "risser-rewards-8b625.firebaseapp.com", "projectId": "risser-rewards-8b625", "storageBucket": "risser-rewards-8b625.firebasestorage.app", "messagingSenderId": "291989692455", "appId": "1:291989692455:web:6e84987e8a2dba5d8f2e02"};
const fb=initializeApp(cfg), auth=getAuth(fb), db=getFirestore(fb), provider=new GoogleAuthProvider();
const FAMILY="risser", familyRef=doc(db,"families",FAMILY);
const themes={Noah:["🐺","Wolf Pack","noah"],Eli:["🦁","Lion Kingdom","eli"],Shepherd:["🐍","Snake Quest","shepherd"],Juniper:["🦄🌈","Rainbow Unicorn World","juniper"]};
const baseKids=[
{id:"noah",name:"Noah",cash:0,car:0,xp:0,target:7500},{id:"eli",name:"Eli",cash:0,car:0,xp:0,target:7500},
{id:"shepherd",name:"Shepherd",cash:0,car:0,xp:0,target:7500},{id:"juniper",name:"Juniper",cash:0,car:0,xp:0,target:7500}
];
const chores=[
["bed","🛏️✨","Make bed",0,0,0],["room","🧸🧺","Keep bedroom clean",0,0,0],["shoes","👟🧺","Put shoes away",0,0,0],["lunch","🍱✅","Empty lunch box",0,0,0],["lunchd","🍽️🫧","Clean lunch dishes",0,0,0],["backpack","🎒🧺","Backpack away",0,0,0],["homework","📚🎒","Homework away",0,0,0],["color","🖍️📦","Coloring stuff away",0,0,0],["living","🛋️✨","Keep living room clean",0,0,1],
["fold","👕🧺","Fold clothes",1,2,1],["putclothes","👚📦","Put clothes away",1,2,0],["laundry","🧺🫧","Full laundry load",3,5,1],["load","🍽️⬇️","Load dishwasher",1,2,1],["unload","🍽️⬆️","Unload dishwasher",1,2,1],["dishes","🫧🍽️","Hand wash dishes",2,3,1],["ktable","🧽🍽️","Clean kitchen table",1,2,1],["trash","🗑️➡️","Take out trash",1,2,1],["cardboard","📦♻️","Cardboard to recycle",1,2,1],
["pets","🐶🐱🥣","Feed dog & cat",.5,1,1],["dogwater","🐶💧","Clean dog water bowl",1,2,1],["catwater","🐱💧","Clean cat water bowl",1,2,1],["litter","🐱🧹","Clean litter box",1.5,2.5,1],["goats","🐐🌾","Feed goats",1.5,2.5,1],["eggs","🥚🧺","Collect eggs",1,1.5,1],["duck","🦆💦","Clean duck pond",5,8,1],["poop","🐶💩","Pick up dog poop",3,5,1],["snake","🐍🧼","Clean snake cages",4,6,1],
["patio","🪑🧹","Clean patio",2,3,1],["towels","🏊🧺","Pool towels reset",1,2,1],["pool","🏖️🧺","Clean pool toys",2,3,1],["sports","🏀🏈⚾","Sports stuff away",1,2,1],["sweep","🧹✨","Sweep",1.5,2.5,1],["mop","🪣🧽","Mop",2.5,4,1],["dust","🪶✨","Dust",1.5,2.5,1],["counters","🧽✨","Living room counters/tables",1,2,1],["carclean","🚙🧹","Clean Mom/Dad car",4,6,1],["carwash","🚗🫧","Wash car",5,8,1],["kart","🏎️🫧","Wash go-kart",3,5,1],["weeds","🌱🧤","Pull weeds",3,5,1],["garage","🧰🧹","Organize garage",7,10,1],["bible","📖⭐","Bible verse of the week",1,3,0],["golf","⛳🔎","Golf Ball Bounty",0,0,0]
].map(x=>({id:x[0],icon:x[1],name:x[2],cash:x[3],car:x[4],exclusive:!!x[5]}));
let user=null,data=null,view="home",kid=0,unsub=null,golfCount=0;

const $=s=>document.querySelector(s), money=n=>"$"+Number(n||0).toFixed(Number(n)%1?2:0), id=()=>crypto.randomUUID();
function isParent(){return !!(user&&data&&((data.ownerUid===user.uid)||(data.parentEmails||[]).map(x=>x.toLowerCase()).includes((user.email||"").toLowerCase())))}
function claimed(c){return (data.tasks||[]).find(t=>t.choreId===c.id&&c.exclusive&&["open","pending"].includes(t.status))}
function header(){return `<div class="top"><div><div class="brand">🚙 Risser Rewards</div><div class="sub">Work hard. Earn it. Build your future.</div></div><div class="actions"><span class="tiny muted">${user?.email||""}</span><button id="logout" class="btn secondary">Sign out</button></div></div><div class="tabs"><button data-v="home" class="tab ${view==="home"?"on":""}">🏠 Family</button><button data-v="pick" class="tab ${view==="pick"?"on":""}">🎯 Chores</button><button data-v="week" class="tab ${view==="week"?"on":""}">✅ My Week</button>${isParent()?`<button data-v="parent" class="tab ${view==="parent"?"on":""}">🔒 Parent ${pending().length?`(${pending().length})`:""}</button>`:""}</div>`}
function pending(){return (data?.tasks||[]).filter(t=>t.status==="pending")}
function hero(k){let t=themes[k.name]||themes.Noah,p=Math.min(100,k.car/k.target*100);return `<div class="kidhero ${t[2]}"><div class="big">${t[0]}</div><h2>${k.name} — ${t[1]}</h2><div class="badge">💵 ${money(k.cash)}</div><div class="badge">🚗 ${money(k.car)}</div><div class="badge">⭐ ${k.xp} XP</div><div class="progress" style="margin-top:12px"><div class="bar" style="width:${p}%"></div></div><div class="tiny" style="margin-top:5px">Road to ${money(k.target)} car fund</div></div>`}
function login(){return `<div class="login card"><div style="font-size:70px">🐺 🦁 🐍 🦄</div><h1>Risser Rewards</h1><p class="muted">Family Sync</p><button id="google" class="btn google">G&nbsp; Continue with Google</button><div class="notice warn tiny">On the family iPad, a parent signs in once. Then leave the app in Kid Mode for the kids.</div></div>`}
function setup(){return `<div class="login card"><h2>🏡 Create Risser Family</h2><p>This Firebase project doesn't have a family yet. The first Google account that creates it becomes the family owner.</p><button id="createFamily" class="btn">Create Family</button><div class="notice warn tiny">Only do this from your Google account.</div></div>`}
function home(){return header()+`<div class="grid">${data.kids.map((k,i)=>`<div class="card"><div class="row"><div><b>${themes[k.name]?.[0]||"⭐"} ${k.name}</b><div class="tiny muted">⭐ ${k.xp} XP</div></div><button class="btn secondary" data-k="${i}">Open</button></div><div class="progress" style="margin-top:12px"><div class="bar" style="width:${Math.min(100,k.car/k.target*100)}%"></div></div><div class="tiny muted" style="margin-top:5px">🚗 ${money(k.car)} / ${money(k.target)}</div></div>`).join("")}</div>`}
function pick(){let k=data.kids[kid];return header()+hero(k)+`<div class="card"><div class="row wrap"><h2>🎯 Pick a Mission</h2><select id="kidSel">${data.kids.map((x,i)=>`<option value="${i}" ${i===kid?"selected":""}>${x.name}</option>`).join("")}</select></div><div class="chores">${chores.map(c=>{let cl=claimed(c),mine=(data.tasks||[]).some(t=>t.kidId===k.id&&t.choreId===c.id&&["open","pending"].includes(t.status)),lock=cl&&cl.kidId!==k.id;return `<button class="chore" data-c="${c.id}" ${lock||mine?"disabled":""}><div class="icon">${c.icon}</div><div class="name">${c.name}</div><div class="reward">${c.id==="golf"?"💰 paid per ball":c.cash||c.car?`💵 ${money(c.cash)} · 🚗 ${money(c.car)}`:"🏠 responsibility"}</div>${lock?`<div class="tiny">🔒 ${data.kids.find(x=>x.id===cl.kidId)?.name||"Claimed"}</div>`:""}</button>`}).join("")}</div></div>`}
function week(){let k=data.kids[kid],tasks=(data.tasks||[]).filter(t=>t.kidId===k.id);return header()+hero(k)+`<div class="card"><div class="row wrap"><h2>✅ My Missions</h2><select id="kidSel">${data.kids.map((x,i)=>`<option value="${i}" ${i===kid?"selected":""}>${x.name}</option>`).join("")}</select></div>${tasks.length?tasks.map(t=>`<div class="task"><div><b>${t.icon} ${t.name}</b><div class="reward">${t.type==="golf"?`${t.count||0} balls · `:""}💵 ${money(t.cash)} · 🚗 ${money(t.car)}</div><div class="status ${t.status}">${t.status}</div></div>${t.status==="open"?`<button class="btn" data-done="${t.id}">${t.type==="golf"?"Count Balls":"I Did It!"}</button>`:""}</div>`).join(""):`<p class="muted">No chores claimed yet.</p>`}</div>`}
function parent(){if(!isParent())return header()+`<div class="card">Not authorized as a parent.</div>`;return header()+`<div class="card"><h2>👍 Waiting for Approval</h2>${pending().length?pending().map(t=>{let k=data.kids.find(x=>x.id===t.kidId);return `<div class="approval"><div><b>${t.icon} ${k?.name} — ${t.name}</b><div class="reward">${t.type==="golf"?`${t.count} balls · `:""}💵 ${money(t.cash)} + 🚗 ${money(t.car)}</div></div><div class="actions"><button class="btn" data-app="${t.id}">Approve</button><button class="btn red" data-back="${t.id}">Send Back</button></div></div>`}).join(""):`<p class="muted">Nothing waiting 🎉</p>`}</div>
<div class="card"><h2>👨‍👩‍👧 Add Parent</h2><p class="muted">Enter the Google email your spouse will use. They can then sign in with Google.</p><div class="row"><input id="parentEmail" placeholder="name@gmail.com"><button id="addParent" class="btn">Authorize</button></div><div class="tiny muted" style="margin-top:8px">Authorized: ${(data.parentEmails||[]).join(", ")||"Owner only"}</div></div>
<div class="card"><h2>📊 Family Totals</h2><div class="grid">${data.kids.map(k=>`<div><b>${k.name}</b><div>💵 ${money(k.cash)} · 🚗 ${money(k.car)} · ⭐ ${k.xp}</div></div>`).join("")}</div></div>`}
function golf(t){return header()+hero(data.kids[kid])+`<div class="card login"><div class="big">⛳🔎</div><h2>Golf Ball Bounty</h2><div class="counter"><button data-n="-1">−</button><div class="count">${golfCount}</div><button data-n="1">+</button></div><div class="notice">💵 ${money(golfCount*(data.golfCash||.05))} cash &nbsp; · &nbsp; 🚗 ${money(golfCount*(data.golfCar||.10))} car fund</div><button id="submitGolf" class="btn" style="margin-top:12px">Submit ${golfCount} Balls</button></div>`}
function render(){if(!user){$("#app").innerHTML=login();bind();return} if(data===null){$("#app").innerHTML=`<div class="login card">Loading family…</div>`;return} if(data===false){$("#app").innerHTML=setup();bind();return} $("#app").innerHTML=view==="home"?home():view==="pick"?pick():view==="week"?week():view==="parent"?parent():view==="golf"?golf():home();bind()}
async function savePatch(p){await updateDoc(familyRef,p)}
function bind(){
$("#google")?.addEventListener("click",async()=>{try{await signInWithPopup(auth,provider)}catch(e){if(/popup|blocked|cancelled/i.test(e.code||"")) await signInWithRedirect(auth,provider); else alert(e.message)}});
$("#logout")?.addEventListener("click",()=>signOut(auth)); document.querySelectorAll("[data-v]").forEach(b=>b.onclick=()=>{view=b.dataset.v;render()});
document.querySelectorAll("[data-k]").forEach(b=>b.onclick=()=>{kid=+b.dataset.k;view="week";render()});
$("#kidSel")?.addEventListener("change",e=>{kid=+e.target.value;render()});
$("#createFamily")?.addEventListener("click",async()=>{await setDoc(familyRef,{ownerUid:user.uid,ownerEmail:user.email,parentEmails:[user.email.toLowerCase()],kids:baseKids,tasks:[],golfCash:.05,golfCar:.10,createdAt:serverTimestamp()});});
document.querySelectorAll("[data-c]").forEach(b=>b.onclick=async()=>{let c=chores.find(x=>x.id===b.dataset.c),k=data.kids[kid];let t={id:id(),choreId:c.id,kidId:k.id,icon:c.icon,name:c.name,cash:c.cash,car:c.car,exclusive:c.exclusive,status:"open",type:c.id==="golf"?"golf":"normal",count:0,createdAt:Date.now()};await savePatch({tasks:arrayUnion(t)});view="week"});
document.querySelectorAll("[data-done]").forEach(b=>b.onclick=async()=>{let t=data.tasks.find(x=>x.id===b.dataset.done);if(t.type==="golf"){golfCount=t.count||0;view="golf";render();return}let tasks=data.tasks.map(x=>x.id===t.id?{...x,status:"pending",submittedAt:Date.now()}:x);await savePatch({tasks})});
document.querySelectorAll("[data-n]").forEach(b=>b.onclick=()=>{golfCount=Math.max(0,Math.min(200,golfCount+(+b.dataset.n)));render()});
$("#submitGolf")?.addEventListener("click",async()=>{if(!golfCount)return;let t=data.tasks.find(x=>x.kidId===data.kids[kid].id&&x.type==="golf"&&x.status==="open");let tasks=data.tasks.map(x=>x.id===t.id?{...x,count:golfCount,cash:+(golfCount*(data.golfCash||.05)).toFixed(2),car:+(golfCount*(data.golfCar||.10)).toFixed(2),status:"pending",submittedAt:Date.now()}:x);await savePatch({tasks});view="week"});
document.querySelectorAll("[data-back]").forEach(b=>b.onclick=async()=>{let tasks=data.tasks.map(x=>x.id===b.dataset.back?{...x,status:"open"}:x);await savePatch({tasks})});
document.querySelectorAll("[data-app]").forEach(b=>b.onclick=async()=>{let tid=b.dataset.app;await runTransaction(db,async tr=>{let snap=await tr.get(familyRef),d=snap.data(),t=d.tasks.find(x=>x.id===tid);if(!t||t.status!=="pending")return;let kids=d.kids.map(k=>k.id===t.kidId?{...k,cash:+((k.cash||0)+t.cash).toFixed(2),car:+((k.car||0)+t.car).toFixed(2),xp:(k.xp||0)+10}:k),tasks=d.tasks.map(x=>x.id===tid?{...x,status:"approved",approvedBy:user.email,approvedAt:Date.now()}:x);tr.update(familyRef,{kids,tasks})})});
$("#addParent")?.addEventListener("click",async()=>{let e=$("#parentEmail").value.trim().toLowerCase();if(!e.includes("@"))return alert("Enter a valid Google email.");await savePatch({parentEmails:arrayUnion(e)});$("#parentEmail").value=""});
}
onAuthStateChanged(auth,async u=>{user=u;if(unsub){unsub();unsub=null}if(!u){data=null;render();return}try{let snap=await getDoc(familyRef);if(!snap.exists()){data=false;render();return}unsub=onSnapshot(familyRef,s=>{data=s.exists()?s.data():false;render()},e=>{$("#app").innerHTML=`<div class="login card"><h2>Firebase permission blocked</h2><p>${e.message}</p><p class="muted">Publish the v4 Firestore rules from FIRESTORE_RULES.txt.</p></div>`})}catch(e){data=false;render()}});
getRedirectResult(auth).catch(()=>{});
</script></body></html>
